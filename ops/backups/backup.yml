# Install ONLY in a dedicated private repository, after recovery-key and credential setup.
name: Encrypted Little Herb Places backup
on:
  workflow_dispatch:
  schedule:
    - cron: '31 8 * * *'
permissions:
  contents: read
concurrency:
  group: encrypted-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require private backup repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = "true"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Export and encrypt
        env:
          SUPABASE_URL: https://qtpepsebztlremlhpxdt.supabase.co
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PUBLIC_KEY: ${{ vars.BACKUP_PUBLIC_KEY }}
          BACKUP_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/lhp-sealed
        run: node scripts/backups/run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lhp-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lhp-sealed/snapshot.enc
            ${{ runner.temp }}/lhp-sealed/envelope.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove encrypted runner output
        if: always()
        run: rm -rf "$RUNNER_TEMP/lhp-sealed"
