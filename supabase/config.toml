project_id = "herbplaces"

[auth]
site_url = "https://littleherbplaces.com"
additional_redirect_urls = [
  "https://littleherbplaces.com",
  "https://littleherbplaces.com/auth/callback",
  "http://localhost:5173/auth/callback",
  "https://littleherbplaces.com/auth/callback\\?next=**",
  "https://littleherbplaces.com/auth/reset-password",
  "https://littleherbplaces.com/auth/reset-password\\?next=**",
  "http://localhost:5173/auth/callback\\?next=**",
  "http://localhost:5173/auth/reset-password",
  "http://localhost:5173/auth/reset-password\\?next=**",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback\\?next=**",
  "http://127.0.0.1:5173/auth/reset-password",
  "http://127.0.0.1:5173/auth/reset-password\\?next=**",
  "http://localhost:5181/auth/callback",
  "http://localhost:5181/auth/callback\\?next=**",
  "http://localhost:5181/auth/reset-password",
  "http://localhost:5181/auth/reset-password\\?next=**",
  "http://127.0.0.1:5181/auth/callback",
  "http://127.0.0.1:5181/auth/callback\\?next=**",
  "http://127.0.0.1:5181/auth/reset-password",
  "http://127.0.0.1:5181/auth/reset-password\\?next=**"
]

[functions.place-management]
# The function validates the user's access token itself, including email confirmation.
verify_jwt = false

[functions.stripe-webhook]
# Stripe authenticates with its webhook signature rather than a Supabase JWT.
verify_jwt = false

[functions.billing-reconcile]
verify_jwt = false

[functions.admin-users]
# Confirmed administrator authorization is checked before the Auth admin API call.
verify_jwt = false

[functions.claim-notifications]
# Database webhooks and the retry scheduler use a dedicated server-side secret.
verify_jwt = false

[functions.admin-notifications]
# Dedicated scheduler secret; this endpoint only delivers new admin review alerts.
verify_jwt = false
